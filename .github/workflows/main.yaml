name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build:
    name: Check Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate and check tracked serializers
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/models/project.g.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test with coverage
        run: flutter test --no-pub --coverage

      - name: Report coverage excluding generated Dart
        run: |
          awk 'BEGIN { RS = "end_of_record\n"; ORS = "" }
            /(^|\n)SF:/ && !/(^|\n)SF:[^\n]+\.g\.dart\r?\n/ { print $0 RS }' \
            coverage/lcov.info > coverage/lcov-filtered.info
          awk -F: '/^LF:/ { found += $2 } /^LH:/ { hit += $2 }
            END { if (found) printf "Line coverage: %.2f%% (%d/%d)\n", 100 * hit / found, hit, found }' \
            coverage/lcov-filtered.info

  build_apk:
    name: Build Android APK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android SDK components
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate serializers
        run: dart run build_runner build

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
